# Configuración de Streamlit
# Para tomar efecto, hay que reiniciar `streamlit run app.py`

[server]
# Tamaño máximo de archivo subido en MB (default: 200)
# Subido a 2000 MB (2 GB) para soportar videos 4K largos
maxUploadSize = 2000

# Tamaño máximo del mensaje WebSocket en MB (default: 200)
maxMessageSize = 2000

# Headless (no abrir navegador automáticamente). Comentar si querés que abra solo.
# headless = true

[browser]
gatherUsageStats = false

# Claro y oscuro: lo decide el sistema del celular/compu (opción
# "Use system setting" del menú de la app, que es la de fábrica).
[theme.light]
primaryColor = "#2E7D32"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4EF"
textColor = "#18231B"

[theme.dark]
primaryColor = "#2E7D32"
backgroundColor = "#0F1411"
secondaryBackgroundColor = "#1C231E"
textColor = "#E8EDE9"
